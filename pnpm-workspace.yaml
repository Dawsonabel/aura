packages:
  - "apps/*"
  - "packages/*"

# React must be a single version across the workspace. apps/mobile (Expo SDK 57 / RN 0.86.2)
# requires exactly 19.2.3, and without this pin transitive deps (Clerk's shared packages) resolve
# react-dom 19.2.8 against that react 19.2.3 — React then throws "Incompatible React versions" at
# runtime and the mobile app fails to boot. Note pnpm 11 reads overrides from here, not package.json.
overrides:
  react: 19.2.3
  react-dom: 19.2.3
allowBuilds:
  '@clerk/shared': true
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  esbuild: true
  sharp: true
  utf-8-validate: true
  workerd: true
minimumReleaseAgeExclude:
  - expo-dev-client@57.0.13
  - expo-dev-launcher@57.0.13
  - expo-dev-menu@57.0.13
