<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gas — Admin Dashboard</title>
<link rel="stylesheet" href="fonts/gas-fonts.css" />
<style>
:root{--orange:#FF531A;--purple:#A31CEE;--ink:#16161a;--muted:#8a8a93;--line:#ececf0;--bg:#f5f6f8;--card:#fff;--gold:#f5b70a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}

/* Login gate */
#gate{position:fixed;inset:0;background:linear-gradient(160deg,#1f1f1f,#2b2b2b);display:flex;align-items:center;justify-content:center;z-index:100}
.gate-card{background:#fff;border-radius:22px;padding:40px;width:360px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.gate-logo{font-family:'Fredoka';font-weight:700;font-size:44px;background:linear-gradient(160deg,#ffd23f,#ff6a00 70%,#ff3d1f);-webkit-background-clip:text;background-clip:text;color:transparent}
.gate-card h2{font-size:20px;margin:6px 0 20px;color:#111}
.gate-card input{width:100%;padding:15px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-weight:700;text-align:center;margin-bottom:14px}
.gate-card button{width:100%;padding:15px;border:none;border-radius:12px;background:var(--orange);color:#fff;font-weight:800;font-size:17px}
.gate-err{color:#e0245e;font-weight:700;font-size:14px;height:18px;margin-bottom:8px}

/* Shell */
#app{display:none;height:100vh;grid-template-columns:230px 1fr;grid-template-rows:60px 1fr}
#app.on{display:grid}
.topbar{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#1f1f1f;color:#fff}
.topbar .brand{font-family:'Fredoka';font-weight:700;font-size:24px;background:linear-gradient(160deg,#ffd23f,#ff6a00 70%,#ff3d1f);-webkit-background-clip:text;background-clip:text;color:transparent}
.topbar .brand small{font-family:'Nunito';font-weight:800;color:#fff;font-size:14px;margin-left:8px;-webkit-text-fill-color:#fff}
.topbar .t-right{display:flex;gap:14px;align-items:center;font-weight:700;font-size:14px;color:#bbb}
.topbar button{background:#333;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:12px;font-weight:800;font-size:16px;color:#555;border:none;background:none;text-align:left}
.nav-item .ni-ico{font-size:19px}
.nav-item.active{background:#fff2ee;color:var(--orange)}
.nav-item:hover:not(.active){background:#f7f7f9}
.main{overflow-y:auto;padding:26px 30px}
.page-title{font-size:28px;font-weight:900;margin-bottom:4px}
.page-sub{color:var(--muted);font-weight:600;margin-bottom:22px}

/* Cards / stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.stat .s-num{font-size:34px;font-weight:900}
.stat .s-lab{color:var(--muted);font-weight:700;margin-top:2px}

/* Panel + tables */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:24px}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.panel-head h3{font-size:18px;font-weight:900}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;letter-spacing:.5px;color:var(--muted);font-weight:800;padding:12px 16px;border-bottom:1px solid var(--line);text-transform:uppercase}
td{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafb}
.avatar-sm{width:34px;height:34px;border-radius:50%;background:#d3c4bd;color:#fff;font-weight:900;font-size:13px;display:inline-flex;align-items:center;justify-content:center;margin-right:8px;vertical-align:middle}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:800}
.chip.boy{background:#dff1fc;color:#1b7fb8}.chip.girl{background:#ffe1ef;color:#c31f74}.chip.nonbinary{background:#f0e2fc;color:#7b28c0}
.swatch{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:middle;margin-right:6px}
select.inline,input.inline{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-weight:700;font-size:14px;background:#fff}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.btn{border:none;border-radius:8px;padding:8px 12px;font-weight:800;font-size:13px}
.btn.orange{background:var(--orange);color:#fff}
.btn.ghost{background:#f0f0f2;color:#444}
.btn.blue{background:#2f8fed;color:#fff}
.btn.red{background:#ffe9e9;color:#e0245e}
.btn.gold{background:var(--gold);color:#fff}
.tgl2{appearance:none;width:44px;height:26px;background:#e0e0e0;border-radius:14px;position:relative;transition:.2s}
.tgl2:checked{background:#34c759}
.tgl2::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.tgl2:checked::after{left:21px}

/* Add form */
.addform{display:flex;flex-wrap:wrap;gap:10px;padding:16px 20px;background:#fafafb;border-top:1px solid var(--line)}
.addform input,.addform select{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px}
.addform input{width:130px}
.empty{padding:30px;text-align:center;color:var(--muted);font-weight:700}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;font-weight:800;padding:14px 22px;border-radius:30px;opacity:0;transition:.25s;z-index:120}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
.filterbar{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.filterbar select,.filterbar input{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px}
</style>
</head>
<body>
  <!-- Login gate -->
  <div id="gate">
    <div class="gate-card">
      <div class="gate-logo">GAS</div>
      <h2>Admin Dashboard</h2>
      <div class="gate-err" id="gateErr"></div>
      <input id="passInput" type="password" placeholder="Admin passcode" onkeydown="if(event.key==='Enter')adminLogin()" />
      <button onclick="adminLogin()">Sign in</button>
    </div>
  </div>

  <!-- App shell -->
  <div id="app">
    <div class="topbar">
      <div class="brand">GAS <small>Admin</small></div>
      <div class="t-right"><span id="lastSync"></span><button onclick="refreshView()" title="Reload latest data">↻ Refresh</button><button onclick="adminLogout()">Log out</button></div>
    </div>
    <div class="sidebar" id="sidebar">
      <button class="nav-item active" data-view="overview" onclick="nav('overview')"><span class="ni-ico">📊</span> Overview</button>
      <button class="nav-item" data-view="schools" onclick="nav('schools')"><span class="ni-ico">🏫</span> Schools</button>
      <button class="nav-item" data-view="users" onclick="nav('users')"><span class="ni-ico">👥</span> Users</button>
      <button class="nav-item" data-view="polls" onclick="nav('polls')"><span class="ni-ico">🗳️</span> Poll Questions</button>
      <button class="nav-item" data-view="flames" onclick="nav('flames')"><span class="ni-ico">🔥</span> Flames / Activity</button>
    </div>
    <div class="main" id="main"></div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="admin.js"></script>
</body>
</html>
