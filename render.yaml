# Render Blueprint — one-click deploy of the Gas backend.
# In Render: New → Blueprint → connect the Dawsonabel/aura repo → Apply.
services:
  - type: web
    name: gas-backend
    runtime: node
    plan: free                 # free = ephemeral disk (SQLite resets on redeploy/sleep). See note below.
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: ADMIN_PASSCODE     # auto-generated strong secret; read it in the Render dashboard to log into /admin
        generateValue: true
      # ---- Optional: real SMS. Leave unset and codes show on-screen (dev mode) — fine for a demo. ----
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      # ---- Optional: persistent DB. Requires a paid instance + the disk block below uncommented. ----
      # - key: DATA_DIR
      #   value: /var/data

# To make accounts survive restarts/redeploys, switch plan to "starter" and uncomment:
#    disk:
#      name: gas-data
#      mountPath: /var/data
#      sizeGB: 1
