# Render Blueprint — one-click deploy of the Gas backend.
# In Render: New → Blueprint → connect the Dawsonabel/aura repo → Apply.
services:
  - type: web
    name: gas-backend
    runtime: node
    plan: free                 # data now lives in Neon Postgres, not local disk — free plan is fine for persistence.
    buildCommand: npm install --include=dev && npm run build   # --include=dev: NODE_ENV=production below would otherwise skip `typescript`
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL       # Neon connection string — set manually in the Render dashboard
        sync: false
      - key: ADMIN_PASSCODE     # auto-generated strong secret; read it in the Render dashboard to log into /admin
        generateValue: true
      # ---- Optional: real SMS. Leave unset and codes show on-screen (dev mode) — fine for a demo. ----
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
